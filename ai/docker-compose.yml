services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: silki
      POSTGRES_USER: silki
      POSTGRES_PASSWORD: silki
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silki -d silki"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["p2"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

