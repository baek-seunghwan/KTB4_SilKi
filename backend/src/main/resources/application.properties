spring.application.name=Silko_BE

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/silko}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:silko}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:silko}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.admin.email=${APP_ADMIN_EMAIL:admin@test.com}
app.admin.password=${APP_ADMIN_PASSWORD:test1234}
app.admin.name=${APP_ADMIN_NAME:테스트 관리자}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.order-session.ttl-minutes=${ORDER_SESSION_TTL_MINUTES:30}
app.security.remember-me-key=${REMEMBER_ME_KEY:local-development-remember-me-key-change-in-production}
app.security.remember-me-validity-seconds=${REMEMBER_ME_VALIDITY_SECONDS:1209600}

app.ai.base-url=${AI_BASE_URL:http://localhost:8000}
app.ai.internal-api-key=${AI_INTERNAL_API_KEY:}
app.ai.reindex-enabled=${AI_REINDEX_ENABLED:false}
app.ai.connect-timeout=${AI_CONNECT_TIMEOUT:1s}
app.ai.reindex-request-timeout=${AI_REINDEX_REQUEST_TIMEOUT:3s}
app.ai.jwt.private-key=${AI_JWT_PRIVATE_KEY:}
app.ai.jwt.issuer=${AI_JWT_ISSUER:silki-be}
app.ai.jwt.audience=${AI_JWT_AUDIENCE:ai-ws}
app.ai.jwt.ttl=${AI_JWT_TTL:2m}

app.storage.type=${STORAGE_TYPE:local}
app.storage.local-path=${LOCAL_STORAGE_PATH:./data/uploads}
app.storage.public-base-url=${IMAGE_PUBLIC_BASE_URL:http://localhost:8080/uploads/}
app.storage.s3-bucket=${S3_BUCKET:}
app.storage.s3-region=${AWS_REGION:ap-northeast-2}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SERVER_SERVLET_SESSION_COOKIE_SECURE:false}

springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
